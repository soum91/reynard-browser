name: Build Tweak

# Reynard Default Browser (Dopamine rootless .deb). Builds in a few minutes, no Gecko involved.

on:
  push:
    paths:
      - "tweak/**"
      - ".github/workflows/tweak.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: brew install ldid dpkg

      - name: Install Theos and iOS SDK
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -R /tmp/theos-sdks/*.sdk "$THEOS/sdks/"

      - name: Build tweak
        id: build
        run: |
          set -o pipefail
          make -C tweak/ReynardDefault clean package FINALPACKAGE=1 ARCHS=arm64 2>&1 | tee build.log

      - name: Report compiler errors
        if: failure()
        run: |
          grep -E 'error:|fatal error|undefined symbol|ld: ' build.log | head -30 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-400 | sed 's/%/%25/g')"
          done

      - name: Name the package with its build number
        run: |
          VERSION=$(awk -F': ' '/^Version:/{print $2}' tweak/ReynardDefault/control)
          DEB=$(find tweak/ReynardDefault/packages -name '*.deb' -print -quit)
          test -n "$DEB"
          mkdir -p dist
          OUT="dist/ReynardDefault-${VERSION}-build-${GITHUB_RUN_NUMBER}.deb"
          cp "$DEB" "$OUT"
          dpkg-deb --contents "$OUT"
          echo "DEB=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ReynardDefault-build-${{ github.run_number }}
          path: dist/*.deb
          if-no-files-found: error

      # Attach to the "tweak" release when it exists (create it once by hand: tag `tweak`).
      - name: Attach to the tweak release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view tweak >/dev/null 2>&1; then
            PREV=$(gh release view tweak --json body --jq .body | grep -o 'build [0-9]*' | head -1 | grep -o '[0-9]*' || true)
            LOG=$(git log --no-merges --pretty='- %s' -15 -- tweak | sed 's/[`]//g')
            printf 'Build %s\n\nChanges:\n%s\n' "$GITHUB_RUN_NUMBER" "$LOG" > notes.md
            gh release upload tweak "$DEB" --clobber
            gh release edit tweak --prerelease --notes-file notes.md
          else
            echo "No 'tweak' release yet; the package is in the run's artifacts."
          fi
