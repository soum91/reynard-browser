name: Publish Sideloading Source

# Puts the latest successful nightly on a rolling "nightly" release and
# refreshes source.json, so AltStore / SideStore (and other sideloaders that
# read the AltStore source format) can install and update Reynard.
#
# Source URL: https://github.com/soum91/reynard-browser/releases/download/nightly/source.json
#
# Each nightly's files carry the Build Nightly run number as the build number
# (Reynard-<version>-build-<N>.ipa), and the release notes list the commits
# since the previously published nightly.

on:
  workflow_run:
    workflows: [Build Nightly]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Build Nightly run ID to publish (blank = latest successful)
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-source
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Pick the build run
        id: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          elif [ -n "${{ inputs.run_id }}" ]; then
            RUN_ID="${{ inputs.run_id }}"
          else
            RUN_ID=$(gh api "repos/$REPO/actions/workflows/build-nightly.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          SHA=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .head_sha)
          BRANCH=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .head_branch)
          BUILD=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .run_number)
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Publishing run $RUN_ID, build $BUILD ($BRANCH @ ${SHA:0:7})"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
          merge-multiple: true

      - name: Make sure the nightly release exists
        run: |
          ls -la dist
          if [ ! -f dist/Reynard.ipa ]; then
            echo "::error::Run ${{ steps.run.outputs.id }} has no Reynard.ipa (the normal IPA wasn't built), nothing to publish."
            exit 1
          fi
          if ! gh release view nightly -R "$REPO" >/dev/null 2>&1; then
            if ! OUT=$(gh release create nightly -R "$REPO" --prerelease --target "${{ steps.run.outputs.sha }}" \
              --title "Nightly (Firefox Sync)" --notes "Rolling nightly build." 2>&1); then
              echo "::error::release create failed: $(echo "$OUT" | tr '\n' ' ')"
              exit 1
            fi
          fi

      - name: Name files with the build number
        run: |
          BUILD="${{ steps.run.outputs.build }}"
          VERSION=$(python3 - dist/Reynard.ipa <<'PY'
          import plistlib, sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          n = next(n for n in z.namelist() if n.startswith("Payload/") and n.count("/") == 2 and n.endswith(".app/Info.plist"))
          print(plistlib.loads(z.read(n))["CFBundleShortVersionString"])
          PY
          )
          SUFFIX="$VERSION-build-$BUILD"
          mv dist/Reynard.ipa "dist/Reynard-$SUFFIX.ipa"
          [ -f dist/Reynard-TrollStore.tipa ] && mv dist/Reynard-TrollStore.tipa "dist/Reynard-TrollStore-$SUFFIX.tipa"
          [ -f dist/Reynard-Jailbroken.ipa ] && mv dist/Reynard-Jailbroken.ipa "dist/Reynard-Jailbroken-$SUFFIX.ipa"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SUFFIX=$SUFFIX" >> "$GITHUB_ENV"
          ls -la dist

      - name: Changelog
        run: |
          SHA="${{ steps.run.outputs.sha }}"
          BUILD="${{ steps.run.outputs.build }}"
          # The previous nightly's commit is kept in a hidden marker in its notes.
          PREV=$(gh release view nightly -R "$REPO" --json body --jq .body | sed -n 's/.*<!-- sha:\([0-9a-f]\{7,40\}\) -->.*/\1/p' | head -n1)
          {
            echo "## Reynard $VERSION (build $BUILD)"
            echo
            echo "Nightly from \`${{ steps.run.outputs.branch }}\` @ \`${SHA:0:7}\`: Firefox Account sign-in, Sync, Send Tab and Receive Tab."
            echo
            if [ -n "$PREV" ] && git cat-file -e "$PREV^{commit}" 2>/dev/null && [ "$(git rev-parse "$PREV")" != "$(git rev-parse "$SHA")" ]; then
              echo "### Changes since ${PREV:0:7}"
              echo
              git log "$PREV..$SHA" --no-merges --pretty='- %s (%h)' | head -n 60
            elif [ -n "$PREV" ] && git cat-file -e "$PREV^{commit}" 2>/dev/null; then
              echo "### Changes"
              echo
              echo "- No code changes since ${PREV:0:7} (rebuild)"
            else
              echo "### Changes"
              echo
              git log "$SHA" --no-merges --pretty='- %s (%h)' -n 30
            fi
            echo
            echo "<!-- sha:$SHA -->"
          } > dist/notes.md
          cat dist/notes.md

      - name: Build source.json
        run: |
          SHA="${{ steps.run.outputs.sha }}"
          NOTES="Build ${{ steps.run.outputs.build }}, nightly from ${{ steps.run.outputs.branch }} @ ${SHA:0:7}: Firefox Account sign-in, Sync, Send Tab and Receive Tab."
          python3 .github/fork/publish_source.py "dist/Reynard-$SUFFIX.ipa" \
            "https://github.com/$REPO/releases/download/nightly/Reynard-$SUFFIX.ipa" \
            "$NOTES" dist/source.json

      - name: Upload to the nightly release
        run: |
          FILES="dist/Reynard-$SUFFIX.ipa dist/source.json"
          [ -f "dist/Reynard-TrollStore-$SUFFIX.tipa" ] && FILES="$FILES dist/Reynard-TrollStore-$SUFFIX.tipa"
          [ -f "dist/Reynard-Jailbroken-$SUFFIX.ipa" ] && FILES="$FILES dist/Reynard-Jailbroken-$SUFFIX.ipa"
          if ! OUT=$(gh release upload nightly -R "$REPO" --clobber $FILES 2>&1); then
            echo "::error::upload failed: $(echo "$OUT" | tr '\n' ' ' | tail -c 800)"
            exit 1
          fi
          # Drop the previous build's IPAs so the rolling release only holds this build.
          gh api "repos/$REPO/releases/tags/nightly" --jq '.assets[] | "\(.id) \(.name)"' | while read -r ID NAME; do
            case "$NAME" in
              *.ipa|*.tipa)
                case "$NAME" in *"-$SUFFIX."*) ;; *) gh api -X DELETE "repos/$REPO/releases/assets/$ID" && echo "removed $NAME" ;; esac ;;
            esac
          done
          gh release edit nightly -R "$REPO" --prerelease --notes-file dist/notes.md \
            --title "Nightly (Firefox Sync) build ${{ steps.run.outputs.build }} $(echo ${{ steps.run.outputs.sha }} | cut -c1-7)"
