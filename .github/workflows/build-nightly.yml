name: Build Nightly

on:
  # On soum91's fork, publish new IPAs after app code changes to main.
  # Documentation and CI-only edits do not trigger multi-hour builds.
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
      - '.github/fork/**'
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      build_normal_ipa:
        description: Build normal IPA
        required: false
        default: true
        type: boolean
      build_trollstore_tipa:
        description: Build TrollStore TIPA
        required: false
        default: true
        type: boolean
      build_jailbroken_ipa:
        description: Build Jailbroken IPA
        required: false
        default: true
        type: boolean

# Keep an in-progress build; collapse superseded queued pushes.
concurrency:
  group: reynard-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.sha }}
      nightly: true
      build_normal_ipa: ${{ github.event_name != 'workflow_dispatch' || inputs.build_normal_ipa }}
      build_trollstore_tipa: ${{ github.event_name != 'workflow_dispatch' || inputs.build_trollstore_tipa }}
      build_jailbroken_ipa: ${{ github.event_name != 'workflow_dispatch' || inputs.build_jailbroken_ipa }}
